                handoffContext: openspec/changes/minicraft-html-game-r3/.comet/handoff/design-context.json
                handoffHash: c0f9463b46ca37674c8c8f9d7dec0d0b4b8d18cdd11253a139521768de2c1ded
                loopNote: "r3: pack generated over final sources (design.md 6fa881ad)"
                proposal: >-
                  Design handoff for minicraft-html-game (bound to approved open
                  artifacts c105b58a and gate-R interview decisions, 7/7
                  resolved).

                  The design document phase will resolve, in dependency order:

                  D1 canvas geometry & page layout: block pixel size, canvas
                  dimensions for the 20x20 grid, palette + reset placement
                  around a single canvas element.

                  D2 terrain formula: exact deterministic layering rows per
                  block type (no RNG), guaranteeing byte-identical initial grid
                  and exact reset restoration.

                  D3 rendering: grid draw on one 2D canvas context, per-type
                  color/texture distinction, repaint strategy (event-driven full
                  repaint vs rAF loop).

                  D4 interaction model: pointer event handling for click and
                  drag-dig, right-click place with occupied-cell no-op,
                  contextmenu suppression, cell hit-testing, keys 1-4 selection.

                  D5 persistence schema: localStorage key name, data format and
                  version field, write points (per edit, on reset), reset
                  semantics restoring D2 terrain.

                  D6 code structure inside the single file: IIFE section layout,
                  pure state functions separated from rendering for whitebox
                  observability, deterministic init.

                  D7 load hygiene posture: zero external references, no console
                  errors, zero network requests by construction.

                  Out of design scope: acceptance automation mechanics (owned by
                  verify gate V), all proposal non-goals (multiplayer, sound,
                  inventory, 3D, camera).
                requirementsEvidence:
                  contentHash: e9e58ba28e2d4f2f387f0bcedd4464f3955769cd2d71506446c6082edcb58e1f
                  ref: openspec/changes/minicraft-html-game-r3
