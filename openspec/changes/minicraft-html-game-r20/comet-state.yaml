            proposal: >-
              Design proposal for minicraft-html-game-r20 (bounded enhancement
              of demos/minicraft/index.html, zero-dependency single-file game):

              1. Hard-block breakage: stone/wood blocks require 3 hits; a crack
              overlay shows per-block break progress (stages at 1 and 2 hits);
              soft blocks (grass) break in 1 hit as today.

              2. Inventory HUD: per-block-type counters of mined-but-not-placed
              blocks; placing decrements; zero-count placement refused.

              3. Persistence: world edits and inventory counters persist via
              localStorage and restore on load.

              Non-goals: no new dependencies, no gameplay systems beyond the two
              enhancements. Acceptance is whitebox-verifiable in the browser.
