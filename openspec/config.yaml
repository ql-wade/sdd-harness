# OpenSpec 项目配置

# 项目上下文（注入所有变更产出物）
# ⚠️ 请根据实际项目修改！建议控制在 50 行以内。
context: |
  语言：中文（简体）。所有产出物用简体中文撰写。

  <!-- TODO(team): 技术栈、代码规范、关键约束。示例：
  Tech stack: TypeScript + React / Java + Spring
  代码规范: camelCase 函数，PascalCase 类型
  -->

# 产出物规则（按 artifact 类型）
rules:
  proposal:
    - 字数控制在 500 字以内
    - 必须包含 Non-goals 章节
    - 必须提供 2-3 个方案选项
    - 必须定义成功指标
  design:
    - 必须列出风险与缓解措施
    - 必须说明 Breaking Changes
  specs:
    - 使用 Given/When/Then Gherkin 格式
    - 覆盖 Happy Path、Edge Cases、Error Cases
  tasks:
    - 每个任务有明确的验证步骤
    - 任务按批次（Batch）组织
