# SDD Harness capability manifest
#
# 安装原则：Core 保持轻量；Adapter 与 Stage 能力显式请求、按需检测。
# `sdd doctor --stage <name> --json` 是运行时权威结果。缺失工具必须报告
# missing；只有确实不适用且提供 reason 时才能标记 not-applicable。

core:
  required:
    - id: node
      name: Node.js
      check: node -v
      min_version: "18.0.0"
    - id: git
      name: Git
      check: git --version

adapters:
  claude:
    support: reference
    install: "sdd init --adapter claude"
    assets: [skills, commands, hooks]
  codex:
    support: preview
    install: "sdd init --adapter codex"
    assets: [skills]
  opencode:
    support: preview
    install: "sdd init --adapter opencode"
    assets: [skills]

optional_install_sets:
  wiki:
    install: "sdd init --adapter claude --with wiki"
    provides: [knowledge-base]
  graph:
    install: "sdd init --adapter claude --with graph"
    provides: [code-graph]
  review:
    install: "sdd init --adapter claude --with review"
    provides: [architecture-review, line-review]

stage_capabilities:
  grill: [spec-engine, agent-host, discovery]
  product: [product-design]
  dev: [spec-engine, workflow-executor, code-graph]
  test: [project-tests, knowledge-base]
  code: [workflow-executor, project-tests]
  review: [architecture-review, line-review]
  verify: [project-tests, runtime-probe, performance-audit, knowledge-base, evidence-audit]
  release: [deploy]
  archive: [spec-engine, knowledge-base]

tool_hints:
  spec-engine:
    check: openspec --version
    install: brew install openspec
  line-review:
    check: ocr llm test
    install: npm i -g @alibaba-group/open-code-review
  code-graph:
    check: ".understand-anything/knowledge-graph.json contains nodes"
    install: "sdd graph --install"
  knowledge-base:
    check: ".mcp.json contains mcpServers.llmwiki"
    install: "sdd init --adapter claude --with wiki"
  runtime-probe:
    check: "Browser/Playwright adapter is callable and emits probe evidence"
  deploy:
    check: "project deploy adapter or an explicit not-applicable reason"
