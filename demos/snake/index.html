<!DOCTYPE html>
<!-- demos/snake/index.html — snake-html-game-r2 deliverable (design.md, sdd-managed-delivery) -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  html, body { margin: 0; padding: 0; background: #101216; color: #e8e6e3;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; justify-content: center; padding: 16px 0; user-select: none; -webkit-user-select: none; }
  #app { width: fit-content; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #hint { font-size: 13px; color: #b9b6b0; }
  #board { display: block; background: #0b0d10; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Snake</h1>
    <span id="hint">Arrows to steer &middot; R to restart</span>
  </header>
  <canvas id="board" width="480" height="480"></canvas>
</div>
<script>
(function () {
  'use strict';

  var GRID = 24;                        // 24 x 24 cells
  var CELL = 20;                        // 20 px per cell -> 480 x 480 canvas
  var STORAGE_KEY = 'snake-high-score-v1';
  var TICK_MS = 120;

  var DIRS = {
    ArrowUp: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }
  };

  function initialSnake() {
    // 3 segments centered, heading right (design D1).
    return [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
  }

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');

  var state = {
    snake: initialSnake(),
    dir: { x: 1, y: 0 },
    pendingDir: null,
    food: null,
    score: 0,
    gameOver: false,
    high: 0
  };

  function readHigh() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw === null ? null : JSON.parse(raw);
      return parsed && typeof parsed.high === 'number' && isFinite(parsed.high) && parsed.high >= 0 ? parsed.high : 0;
    } catch (err) { return 0; }
  }

  function writeHigh() {
    // Max of stored and current (design D6); single-key JSON blob.
    var next = { high: Math.max(readHigh(), state.score) };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (err) { /* private mode */ }
    state.high = next.high;
  }

  function randomFreeCell() {
    for (var guard = 0; guard < 1000; guard++) {
      var x = Math.floor(Math.random() * GRID);
      var y = Math.floor(Math.random() * GRID);
      var onSnake = state.snake.some(function (p) { return p.x === x && p.y === y; });
      if (!onSnake) return { x: x, y: y };
    }
    return { x: 0, y: 0 }; // unreachable at 24x24 with a 3-segment snake
  }

  function inBounds(p) {
    return p.x >= 0 && p.x < GRID && p.y >= 0 && p.y < GRID;
  }

  // Pure step (design D2): one tick. Check-before-commit — a fatal move
  // freezes the board with the head resting on its last in-bounds cell.
  function stepGame() {
    if (state.gameOver) return;
    if (state.pendingDir) {
      state.dir = state.pendingDir;
      state.pendingDir = null;
    }
    var head = state.snake[0];
    var next = { x: head.x + state.dir.x, y: head.y + state.dir.y };
    if (!inBounds(next)) {
      state.gameOver = true;
      writeHigh();
      return;
    }
    var hitBody = state.snake.some(function (p) { return p.x === next.x && p.y === next.y; });
    if (hitBody) {
      state.gameOver = true;
      writeHigh();
      return;
    }
    state.snake.unshift(next);
    if (next.x === state.food.x && next.y === state.food.y) {
      state.score += 10;               // grow: tail not popped this tick
      state.food = randomFreeCell();
    } else {
      state.snake.pop();
    }
  }

  // ---- rendering (design D5) --------------------------------------------------
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0b0d10';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#3fa34d';
    for (var i = 0; i < state.snake.length; i++) {
      ctx.fillRect(state.snake[i].x * CELL + 1, state.snake[i].y * CELL + 1, CELL - 2, CELL - 2);
    }
    ctx.fillStyle = '#d43d3d';
    ctx.fillRect(state.food.x * CELL + 4, state.food.y * CELL + 4, CELL - 8, CELL - 8);
    // Right-top HUD (SCORE / HIGH).
    ctx.fillStyle = '#e8e6e3';
    ctx.font = '12px monospace';
    ctx.fillText('SCORE ' + state.score, canvas.width - 110, 18);
    ctx.fillText('HIGH ' + state.high, canvas.width - 110, 34);
    if (state.gameOver) {
      ctx.fillStyle = 'rgba(11,13,16,0.72)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#e8e6e3';
      ctx.font = '24px monospace';
      ctx.fillText('GAME OVER — SCORE ' + state.score, canvas.width / 2 - 130, canvas.height / 2 - 8);
      ctx.font = '13px monospace';
      ctx.fillText('PRESS R TO RESTART', canvas.width / 2 - 78, canvas.height / 2 + 18);
    }
  }

  // ---- input (design D3/D4) ---------------------------------------------------
  function turn(key) {
    var d = DIRS[key];
    if (!d || state.gameOver) return;
    // Exact 180-degree reversal of the CURRENT heading is ignored.
    if (d.x === -state.dir.x && d.y === -state.dir.y) return;
    state.pendingDir = d;
  }

  function reset() {
    state.high = readHigh();           // HIGH restored from storage
    state.snake = initialSnake();
    state.dir = { x: 1, y: 0 };
    state.pendingDir = null;
    state.score = 0;
    state.gameOver = false;
    state.food = randomFreeCell();
    render();
  }

  document.addEventListener('keydown', function (e) {
    if (DIRS[e.key]) {
      e.preventDefault();
      turn(e.key);
    } else if (e.key === 'r' || e.key === 'R') {
      reset();
    }
  }, false);

  // ---- __test hook (design D7): live state + one full tick per step() ---------
  globalThis.__test = {
    state: state,
    step: function () { stepGame(); render(); },
    turn: turn,
    reset: reset
  };

  // ---- init --------------------------------------------------------------------
  state.high = readHigh();
  state.food = randomFreeCell();
  render();
  setInterval(function () { stepGame(); render(); }, TICK_MS);
})();
</script>
</body>
</html>
