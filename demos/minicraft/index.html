<!DOCTYPE html>
<!-- demos/minicraft/index.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minicraft</title>
<style>
  html, body { margin: 0; padding: 0; background: #1c1f24; color: #e8e6e3;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; justify-content: center; padding: 16px 0; user-select: none; -webkit-user-select: none; }
  #app { width: fit-content; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #active { font-size: 13px; color: #b9b6b0; }
  #board { display: block; background: #101216; cursor: crosshair; touch-action: none; }
  #palette { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .swatch { width: 28px; height: 28px; border: 2px solid #3a3f47; border-radius: 4px; padding: 0; cursor: pointer; }
  .swatch.selected { border-color: #ffffff; box-shadow: 0 0 0 1px #ffffff88; }
  #reset { margin-left: auto; padding: 6px 12px; font-size: 13px; color: #e8e6e3;
    background: #2a2f37; border: 1px solid #3a3f47; border-radius: 4px; cursor: pointer; }
  #reset:active { background: #3a3f47; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Minicraft</h1>
    <span id="active">Grass</span>
  </header>
  <canvas id="board" width="480" height="480"></canvas>
  <div id="palette">
    <button class="swatch selected" data-type="1" style="background:#5aa331" aria-label="Grass"></button>
    <button class="swatch" data-type="2" style="background:#8a5a2b" aria-label="Dirt"></button>
    <button class="swatch" data-type="3" style="background:#8c8c8c" aria-label="Stone"></button>
    <button class="swatch" data-type="4" style="background:#a07840" aria-label="Wood"></button>
    <button id="reset" type="button">Reset</button>
  </div>
</div>
<script>
(function () {
  'use strict';

  // ---- CONFIG & TYPES -------------------------------------------------------
  var SIZE = 20;                       // 20 x 20 grid
  var CELL = 24;                       // 24 px per cell -> 480 x 480 canvas
  var STORAGE_KEY = 'minicraft-grid-v1';
  var TYPES = {
    1: { name: 'Grass', color: '#5aa331', hardness: 1 },
    2: { name: 'Dirt',  color: '#8a5a2b', hardness: 1 },
    3: { name: 'Stone', color: '#8c8c8c', hardness: 3 },
    4: { name: 'Wood',  color: '#a07840', hardness: 3 }
  };

  // ---- STATE ----------------------------------------------------------------
  var grid = new Uint8Array(SIZE * SIZE);
  var selected = 1;
  var hover = null;                    // {x, y} while pointer is over the board
  var dragging = false;
  var damage = new Map();              // cell index -> hits; transient, never persisted
  var inventory = { 1: 0, 2: 0, 3: 0, 4: 0 };   // mined-but-unplaced blocks per type
  var lastHitCell = -1;                // cell-entry edge guard: one dig per cell entry

  // ---- PURE FUNCTIONS -------------------------------------------------------
  // Deterministic initial terrain (design D2): no RNG anywhere.
  function initialGrid() {
    var cells = new Uint8Array(SIZE * SIZE);
    for (var y = 0; y < SIZE; y++) {
      var type = y < 4 ? 1 : y < 10 ? 2 : y < 18 ? 3 : 4;
      for (var x = 0; x < SIZE; x++) cells[y * SIZE + x] = type;
    }
    return cells;
  }

  function cellFromEvent(e) {
    var x = Math.floor(e.offsetX / CELL);
    var y = Math.floor(e.offsetY / CELL);
    if (x < 0 || y < 0 || x >= SIZE || y >= SIZE) return null;
    return { x: x, y: y, index: y * SIZE + x };
  }

  function validCells(cells) {
    if (!Array.isArray(cells) || cells.length !== SIZE * SIZE) return false;
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      if (typeof c !== 'number' || !isFinite(c) || Math.floor(c) !== c || c < 0 || c > 4) return false;
    }
    return true;
  }

  function validInventory(value) {
    if (!value || typeof value !== 'object' || Array.isArray(value)) return false;
    for (var t = 1; t <= 4; t++) {
      var n = value[t];
      if (typeof n !== 'number' || !isFinite(n) || Math.floor(n) !== n || n < 0) return false;
    }
    return true;
  }

  function zeroInventory() { return { 1: 0, 2: 0, 3: 0, 4: 0 }; }

  // validSave accepts v1 ({version, cells}) and v2 ({version, cells, inventory});
  // an invalid inventory fails soft at load (stock zeroed), it never voids the world.
  function validSave(value) {
    if (!value) return false;
    if (value.version !== 1 && value.version !== 2) return false;
    return validCells(value.cells);
  }

  function serializeGrid(cells) {
    return JSON.stringify({ version: 2, cells: Array.prototype.slice.call(cells), inventory: inventory });
  }

  // ---- PERSISTENCE (D5) -----------------------------------------------------
  function storage() {
    try { return window.localStorage; } catch (err) { return null; }
  }

  // Missing (v1) or invalid inventory migrates to all-zero stock.
  function resetInventory(values) {
    var src = validInventory(values) ? values : zeroInventory();
    for (var t = 1; t <= 4; t++) inventory[t] = src[t];
  }

  function loadGrid() {
    var store = storage();
    if (!store) { resetInventory(null); return initialGrid(); }
    var raw = null;
    try { raw = store.getItem(STORAGE_KEY); } catch (err) { raw = null; }
    if (raw === null) { resetInventory(null); return initialGrid(); }
    var parsed = null;
    try { parsed = JSON.parse(raw); } catch (err) { parsed = null; }
    if (!validSave(parsed)) { resetInventory(null); return initialGrid(); }   // whole-save fail-soft
    resetInventory(parsed.inventory);   // missing or invalid inventory -> zeros
    return Uint8Array.from(parsed.cells);
  }

  function saveGrid() {
    var store = storage();
    if (!store) return;
    try { store.setItem(STORAGE_KEY, serializeGrid(grid)); } catch (err) { /* private mode */ }
  }

  function clearGrid() {
    var store = storage();
    if (!store) return;
    try { store.removeItem(STORAGE_KEY); } catch (err) { /* private mode */ }
  }

  // ---- RENDERING (D3) -------------------------------------------------------
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var activeReadout = document.getElementById('active');

  // Deterministic crack overlay: a pure function of (x, y, stage), no RNG.
  function drawCrack(x, y, stage) {
    var cx = x * CELL + CELL / 2;
    var cy = y * CELL + CELL / 2;
    var arms = 2 + stage;
    ctx.strokeStyle = 'rgba(15,15,15,0.6)';
    ctx.lineWidth = 1;
    for (var a = 0; a < arms; a++) {
      var dir = ((a * 137 + x * 31 + y * 17 + stage * 53) % 360) * Math.PI / 180;
      var mid = 3 + ((a * 7 + stage * 5 + x + y) % 5);
      var reach = 6 + ((a * 11 + x * 3 + y * 5 + stage * 13) % 6);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(dir) * mid, cy + Math.sin(dir) * mid);
      ctx.lineTo(cx + Math.cos(dir) * reach, cy + Math.sin(dir) * reach);
      ctx.stroke();
    }
  }

  function renderHud() {
    var panelW = 92, rowH = 18;
    var panelH = rowH * 4 + 10;
    var px = canvas.width - panelW - 6;
    var py = 6;
    ctx.fillStyle = 'rgba(16,18,22,0.85)';
    ctx.fillRect(px, py, panelW, panelH);
    ctx.strokeStyle = '#3a3f47';
    ctx.strokeRect(px + 0.5, py + 0.5, panelW - 1, panelH - 1);
    ctx.font = '11px monospace';
    for (var t = 1; t <= 4; t++) {
      var ry = py + 5 + (t - 1) * rowH;
      ctx.fillStyle = TYPES[t].color;
      ctx.fillRect(px + 6, ry, 10, 10);
      ctx.fillStyle = '#e8e6e3';
      ctx.fillText(TYPES[t].name + ' x' + inventory[t], px + 22, ry + 9);
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#101216';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        var type = grid[y * SIZE + x];
        if (type === 0) continue;
        ctx.fillStyle = TYPES[type].color;
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        // deterministic per-cell texture: 2px darker inset at offset (x*31 + y*17) % 6
        var inset = 3 + ((x * 31 + y * 17) % 6);
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(x * CELL + inset, y * CELL + inset, CELL - inset * 2, CELL - inset * 2);
        // crack overlay after the texture, for hits in [1, hardness-1]
        var hits = damage.get(y * SIZE + x);
        if (hits >= 1 && hits < TYPES[type].hardness) drawCrack(x, y, hits);
      }
    }
    // hairline grid
    ctx.strokeStyle = '#00000022';
    ctx.lineWidth = 1;
    for (var i = 0; i <= SIZE; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL + 0.5, 0); ctx.lineTo(i * CELL + 0.5, SIZE * CELL); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL + 0.5); ctx.lineTo(SIZE * CELL, i * CELL + 0.5); ctx.stroke();
    }
    // hover outline
    if (hover) {
      ctx.strokeStyle = '#ffffffcc';
      ctx.lineWidth = 2;
      ctx.strokeRect(hover.x * CELL + 1, hover.y * CELL + 1, CELL - 2, CELL - 2);
    }
    renderHud();                       // right-top inventory panel, last in the pipeline
  }

  function renderSelection() {
    activeReadout.textContent = TYPES[selected].name;
    var buttons = document.querySelectorAll('.swatch');
    for (var i = 0; i < buttons.length; i++) {
      var type = Number(buttons[i].getAttribute('data-type'));
      buttons[i].classList.toggle('selected', type === selected);
      buttons[i].style.opacity = inventory[type] > 0 ? '' : '0.35';   // grey out empty stock
    }
  }

  // ---- INPUT (D4) -----------------------------------------------------------
  function setState(mutate, persist) {
    mutate();
    if (persist !== false) saveGrid();   // every dig/place edit persists
    render();
    renderSelection();                   // palette greying rides the same funnel
  }

  // One dig per cell-entry edge; same-cell pointermove never adds a hit.
  function hitCell(cell) {
    if (!cell || cell.index === lastHitCell) return false;
    lastHitCell = cell.index;
    var type = grid[cell.index];
    if (type === 0) return false;
    var hits = (damage.get(cell.index) || 0) + 1;
    if (hits < TYPES[type].hardness) {
      setState(function () { damage.set(cell.index, hits); }, false);   // transient: no save
    } else {
      setState(function () {
        grid[cell.index] = 0;
        damage.delete(cell.index);
        inventory[type] += 1;
      });
    }
    return true;
  }

  function placeAt(cell) {
    if (!cell || grid[cell.index] !== 0) return;   // place only into empty cells
    if ((inventory[selected] || 0) < 1) return;    // refuse at zero before any mutation
    setState(function () {
      grid[cell.index] = selected;
      inventory[selected] -= 1;
    });
  }

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var cell = cellFromEvent(e);
    if (!cell) return;
    if (e.button === 0) {
      dragging = true;
      hitCell(cell);
    } else if (e.button === 2) {
      placeAt(cell);
    }
  }, false);

  canvas.addEventListener('pointermove', function (e) {
    var cell = cellFromEvent(e);
    var newHover = cell ? { x: cell.x, y: cell.y } : null;
    var hoverChanged = (newHover === null) !== (hover === null) ||
      (newHover && hover && (newHover.x !== hover.x || newHover.y !== hover.y));
    hover = newHover;
    var acted = dragging && cell ? hitCell(cell) : false;
    if (!acted && hoverChanged) {
      render();
    }
  }, false);

  function endDrag() { dragging = false; lastHitCell = -1; }
  canvas.addEventListener('pointerup', endDrag, false);
  canvas.addEventListener('pointerleave', function () { hover = null; endDrag(); render(); }, false);

  document.addEventListener('keydown', function (e) {
    if (e.key >= '1' && e.key <= '4') {
      selected = Number(e.key);
      renderSelection();
    }
  }, false);

  var swatches = document.querySelectorAll('.swatch');
  for (var s = 0; s < swatches.length; s++) {
    swatches[s].addEventListener('click', function (e) {
      selected = Number(e.currentTarget.getAttribute('data-type'));
      renderSelection();
    }, false);
  }

  document.getElementById('reset').addEventListener('click', function () {
    setState(function () {
      grid = initialGrid();
      damage.clear();
      resetInventory(null);         // stock back to zero
      clearGrid();                  // reset removes the key entirely (D5)
    }, false);
  }, false);

  // ---- INIT -----------------------------------------------------------------
  grid = loadGrid();
  renderSelection();
  render();
})();
</script>
</body>
</html>
