# Pinned deepwiki-open native frontend/API layout; declaration only, no automatic launch.
# Source/provider/auth credentials and ingestion are not configured by this empty-instance template.
# CODEWIKI_IMAGE must resolve from the fixed I05 image lock. Graph is optional and has no service here
# until a separate implementation and lifecycle have actually been selected and qualified.
services:
  codewiki-app:
    image: ${CODEWIKI_IMAGE:?must be resolved from infra/delivery/code-knowledge/images.lock.json before up}
    restart: "no"
    environment:
      PORT: "8001"
      NODE_ENV: production
      SERVER_BASE_URL: http://127.0.0.1:8001
      LOG_FILE_PATH: api/logs/application.log
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - code-knowledge-internal
    ports:
      - "127.0.0.1:${CODEWIKI_PORT:-17400}:3000"
      - "127.0.0.1:${CODEWIKI_API_PORT:-17402}:8001"
    volumes:
      - codewiki-data:/root/.adalflow
      - codewiki-logs:/app/api/logs
    mem_limit: 6g
    mem_reservation: 2g
    cpus: 2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  codewiki-data:
  codewiki-logs:

networks:
  code-knowledge-internal:
    internal: true
