# Outline 独立资料域声明（OutlineInfra.v1）— 仅声明，绝不自动启动。
# 镜像一律从 infra/delivery/outline/images.lock.json 解析后注入（${VAR:?} 占位）；
# lock 未 ready（无任何已认证 digest）时 tools/infra/outline.mjs up 必须拒绝，本文件绝不内嵌 tag/digest。
# 端口仅绑定 loopback；专用 internal 网络；除具名卷外不挂载任何宿主路径（无宿主敏感挂载）。
# restart 策略保持 "no"：重启监督与持久性证明分离，持久性由 restart-persistence probe 实测而非 restart 策略假设。
# OIDC 提供方位置未选定：网络保持 internal，出网策略在 provider 选定后显式修订（当前 UNVERIFIED）。

services:
  outline:
    image: ${OUTLINE_IMAGE:?must be resolved from infra/delivery/outline/images.lock.json before up}
    restart: "no"
    environment:
      URL: ${URL:?registered loopback URL required}
      PORT: "3000"
      NODE_ENV: production
      FORCE_HTTPS: "false"
      SECRET_KEY: ${SECRET_KEY:?resolved app-session ref required}
      UTILS_SECRET: ${UTILS_SECRET:?separate utilities binding required}
      DATABASE_URL: ${DATABASE_URL:?resolved application DB role required}
      REDIS_URL: ${REDIS_URL:?registered private cache URL required}
      FILE_STORAGE: s3
      AWS_S3_UPLOAD_BUCKET_URL: ${AWS_S3_UPLOAD_BUCKET_URL:?endpoint reachable by server and signed-URL clients required}
      AWS_S3_UPLOAD_BUCKET_NAME: ${AWS_S3_UPLOAD_BUCKET_NAME:?registered bucket required}
      AWS_REGION: ${AWS_REGION:?registered region required}
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?bucket-scoped application credential required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?bucket-scoped application credential required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?registered client required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?resolved client ref required}
      OIDC_AUTH_URI: ${OIDC_AUTH_URI:?registered authorization endpoint required}
      OIDC_TOKEN_URI: ${OIDC_TOKEN_URI:?registered token endpoint required}
      OIDC_USERINFO_URI: ${OIDC_USERINFO_URI:?registered userinfo endpoint required}
    depends_on:
      - outline-postgres
      - outline-redis
      - outline-object-store
    networks:
      - outline-internal
    ports:
      - "127.0.0.1:${OUTLINE_PORT:-3000}:3000"
    volumes:
      - outline-data:/var/lib/outline/data

  outline-postgres:
    image: ${OUTLINE_POSTGRES_IMAGE:?must be resolved from infra/delivery/outline/images.lock.json before up}
    restart: "no"
    environment:
      POSTGRES_DB: outline
      POSTGRES_USER: outline-bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?separate DB bootstrap credential required}
    networks:
      - outline-internal
    volumes:
      - outline-db:/var/lib/postgresql/data

  outline-redis:
    image: ${OUTLINE_REDIS_IMAGE:?must be resolved from infra/delivery/outline/images.lock.json before up}
    restart: "no"
    networks:
      - outline-internal

  outline-object-store:
    image: ${OUTLINE_OBJECT_STORE_IMAGE:?must be resolved from infra/delivery/outline/images.lock.json before up}
    restart: "no"
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?separate storage bootstrap identity required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?separate storage bootstrap credential required}
    networks:
      - outline-internal
    ports:
      - "127.0.0.1:${OUTLINE_OBJECT_STORE_PORT:-9000}:9000"
    volumes:
      - outline-attachments:/data

volumes:
  outline-data:
  outline-db:
  outline-attachments:

networks:
  outline-internal:
    internal: true
