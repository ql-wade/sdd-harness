# [RETIRED 2026-10-26 / ADR-0021 / 修订 2026-10-26-comet-050-adoption-v1]
# 六角色常驻部署已从所有默认安装/启动/检查路径退休：本文件仅作为历史/按需声明保留，
# 无任何自动入口；tools/infra/runner.mjs up 一律拒绝且绝不触碰 docker。
# 按需临时作业走 createCliJobDriver（单次容器、network none、只读根），不经本 compose 栈。
# 旧 Run/证据/镜像识别/卷保留，退休不删除任何容器、卷、知识或备份。
#
# Comet Runner 角色隔离声明（RunnerInfra.v1 / RoleBoundary.v1）—— 仅声明，绝不自动启动。
# 镜像一律从 infra/delivery/runner/image.lock.json 解析后注入（${VAR:?} 占位）；
# lock 未 ready（无任何已认证 digest）时 tools/infra/runner.mjs up 必须拒绝，本文件绝不内嵌 tag/digest。
# 六角色（role-policy.json）：controller/author/test-author/reviewer/publisher/isolator —— 独立 principal、独立卷、独立凭据作用域。
# 只读根文件系统、drop ALL capabilities、no-new-privileges；除具名卷外不挂载任何宿主路径；无 docker.sock、无宿主 HOME。
# 控制卷（/comet/*）只挂 comet-controller；worker 角色只挂各自 ws-* 卷（workspace-mounts.json 结构表达）。
# CLI job 模板不发布任何端口；专用 internal 网络只表达默认出网拒绝，实际作业由固定受管 host 驱动。
# restart 策略保持 "no"：原实例监督与复制状态拒绝属 Authority.v1 启动检查，由 probe duplicate-authority 实测而非 restart 策略假设。

services:
  comet-controller:
    image: ${COMET_RUNNER_IMAGE:?must be resolved from infra/delivery/runner/image.lock.json before up}
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - runner-internal
    volumes:
      - comet-control-state:/comet/state
      - comet-receipts:/comet/receipts
      - comet-issuance:/comet/issuance
      - ws-controller:/workspace

  comet-author:
    image: ${COMET_RUNNER_IMAGE:?must be resolved from infra/delivery/runner/image.lock.json before up}
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - runner-internal
    volumes:
      - ws-author:/workspace

  comet-test-author:
    image: ${COMET_RUNNER_IMAGE:?must be resolved from infra/delivery/runner/image.lock.json before up}
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - runner-internal
    volumes:
      - ws-test-author:/workspace

  comet-reviewer:
    image: ${COMET_RUNNER_IMAGE:?must be resolved from infra/delivery/runner/image.lock.json before up}
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - runner-internal
    volumes:
      - ws-reviewer:/workspace

  comet-publisher:
    image: ${COMET_RUNNER_IMAGE:?must be resolved from infra/delivery/runner/image.lock.json before up}
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - runner-internal
    volumes:
      - ws-publisher:/workspace

  comet-isolator:
    image: ${COMET_RUNNER_IMAGE:?must be resolved from infra/delivery/runner/image.lock.json before up}
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - runner-internal
    volumes:
      - ws-isolator:/workspace

volumes:
  comet-control-state:
  comet-receipts:
  comet-issuance:
  ws-controller:
  ws-author:
  ws-test-author:
  ws-reviewer:
  ws-publisher:
  ws-isolator:

networks:
  runner-internal:
    internal: true
